name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit

  release:
    # Every push to main releases the next version. The bump is read from the
    # conventional-commit subjects since the last tag: `type!:` or a
    # `BREAKING CHANGE:` footer is major, `feat:` is minor, anything else patch —
    # except while the major is still 0, where breaking is capped at minor.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$last" ]; then
            range="$last..HEAD"
            base="${last#v}"
          else
            range=""
            base="0.0.0"
          fi
          subjects=$(git log --format='%s' ${range:+$range})
          bodies=$(git log --format='%b' ${range:+$range})
          if [ -z "$subjects" ]; then
            echo "HEAD is already released as $last; nothing to release."
            exit 0
          fi
          if grep -qE '^[a-z]+(\([^)]+\))?!:' <<<"$subjects" \
            || grep -qE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
            bump=major
          elif grep -qE '^feat(\([^)]+\))?:' <<<"$subjects"; then
            bump=minor
          else
            bump=patch
          fi
          IFS=. read -r major minor patch <<<"$base"
          patch=${patch:-0}
          if [ "$major" -eq 0 ] && [ "$bump" = major ]; then
            bump=minor
          fi
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          echo "$bump bump: $base -> $version"
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes
          echo "version=$version" >> "$GITHUB_OUTPUT"

  apk:
    # Builds the signed APK and attaches it to the release `release` just cut.
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Stamp version into app.json
        run: |
          set -euo pipefail
          # versionCode must only ever grow; the run number does.
          jq --arg v "$VERSION" --argjson c "${{ github.run_number }}" \
            '.expo.version = $v | .expo.android.versionCode = $c' app.json > app.json.tmp
          mv app.json.tmp app.json
      - name: Generate android project
        run: npx expo prebuild --platform android --no-install
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "KEYSTORE_B64 secret is empty or missing"; exit 1; }
          # tr strips CR/whitespace a copy-paste may have added; base64 only ignores newlines.
          printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore
      - name: Patch gradle signing
        run: |
          set -euo pipefail
          # Add a release signingConfig sourced from env…
          perl -0pi -e 's/(signingConfigs \{)/$1\n        release {\n            storeFile file("release.keystore")\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }/' android/app/build.gradle
          # …and make the release buildType use it instead of the debug key.
          perl -0pi -e 's/(release \{(?:(?!\}).)*?)signingConfig signingConfigs\.debug/$1signingConfig signingConfigs.release/s' android/app/build.gradle
      - name: Verify signing patch
        run: |
          grep -q 'signingConfigs.release' android/app/build.gradle || {
            echo "signing patch did not match; generated signing/buildTypes section follows:"
            sed -n '/signingConfigs {/,/^}/p' android/app/build.gradle
            sed -n '/buildTypes {/,/^}/p' android/app/build.gradle
            exit 1
          }
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd android && ./gradlew --no-daemon assembleRelease
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="papra-android-client-v$VERSION.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "v$VERSION" "$apk"
