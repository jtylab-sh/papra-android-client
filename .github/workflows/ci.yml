name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes the running build: cancel it instead of finishing
# a release nobody will install. The newer run cuts its own complete release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit

  version:
    # Computes the next version from the conventional-commit subjects since the
    # last tag: `type!:` or a `BREAKING CHANGE:` footer is major, `feat:` is
    # minor, anything else patch. The release itself is created by the `apk`
    # job AFTER a successful build, with the APK attached — so a failed or
    # cancelled build leaves no empty release behind.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          set -euo pipefail
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$last" ]; then
            range="$last..HEAD"
            base="${last#v}"
          else
            range=""
            base="0.0.0"
          fi
          subjects=$(git log --format='%s' ${range:+$range})
          bodies=$(git log --format='%b' ${range:+$range})
          if [ -z "$subjects" ]; then
            echo "HEAD is already released as $last; nothing to release."
            exit 0
          fi
          if grep -qE '^[a-z]+(\([^)]+\))?!:' <<<"$subjects" \
            || grep -qE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
            bump=major
          elif grep -qE '^feat(\([^)]+\))?:' <<<"$subjects"; then
            bump=minor
          else
            bump=patch
          fi
          IFS=. read -r major minor patch <<<"$base"
          patch=${patch:-0}
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          echo "$bump bump: $base -> $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  apk:
    # Builds the signed APK, then cuts the release with the APK attached.
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Caches the Gradle distribution and dependency cache between runs —
      # cuts the APK build from ~20+ min (cold) to roughly half.
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Stamp version into app.json
        run: |
          set -euo pipefail
          # versionCode must only ever grow; the run number does.
          jq --arg v "$VERSION" --argjson c "${{ github.run_number }}" \
            '.expo.version = $v | .expo.android.versionCode = $c' app.json > app.json.tmp
          mv app.json.tmp app.json
      - name: Generate android project
        run: npx expo prebuild --platform android --no-install
      # arm64-only cuts the native (C++) build to a quarter and the APK from
      # ~107 MB to ~40 MB — every phone since ~2016 is arm64. Gradle build
      # cache + parallel reuse compiled work across runs (setup-gradle
      # persists ~/.gradle/caches between runs).
      - name: Speed up native build
        run: |
          printf '%s\n' \
            'reactNativeArchitectures=arm64-v8a' \
            'org.gradle.parallel=true' \
            'org.gradle.caching=true' >> android/gradle.properties
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "KEYSTORE_B64 secret is empty or missing"; exit 1; }
          # tr strips CR/whitespace a copy-paste may have added; base64 only ignores newlines.
          printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore
      - name: Patch gradle signing
        run: |
          set -euo pipefail
          # Add a release signingConfig sourced from env…
          perl -0pi -e 's/(signingConfigs \{)/$1\n        release {\n            storeFile file("release.keystore")\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }/' android/app/build.gradle
          # …and make the release buildType use it instead of the debug key.
          perl -0pi -e 's/(release \{(?:(?!\}).)*?)signingConfig signingConfigs\.debug/$1signingConfig signingConfigs.release/s' android/app/build.gradle
      - name: Verify signing patch
        run: |
          grep -q 'signingConfigs.release' android/app/build.gradle || {
            echo "signing patch did not match; generated signing/buildTypes section follows:"
            sed -n '/signingConfigs {/,/^}/p' android/app/build.gradle
            sed -n '/buildTypes {/,/^}/p' android/app/build.gradle
            exit 1
          }
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          cd android && ./gradlew --no-daemon --build-cache --parallel --stacktrace assembleRelease 2>&1 | tee /tmp/gradle.log
      # Job logs are admin-only via the API. Publish the failure excerpt as a
      # commit comment (public, readable via the REST API) and in the step summary.
      - name: Surface gradle failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # node/tool stderr appears BEFORE gradle's FAILURE block — include it.
          ln=$(grep -n "FAILURE: Build failed" /tmp/gradle.log | head -1 | cut -d: -f1)
          if [ -n "$ln" ]; then
            start=$(( ln > 150 ? ln - 150 : 1 ))
            excerpt=$(sed -n "${start},$((ln + 15))p" /tmp/gradle.log)
          else
            excerpt=$(tail -160 /tmp/gradle.log)
          fi
          {
            echo '## Gradle failure'
            echo '```'
            printf '%s\n' "$excerpt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg body "CI gradle failure (run ${GITHUB_RUN_NUMBER}):
          \`\`\`
          $excerpt
          \`\`\`" '{body: $body}' | curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -d @- -o /dev/null -w "commit comment: %{http_code}\n"
      - name: Create release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="papra-android-client-v$VERSION.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$apk"
          # Tag + release + asset in one atomic step — only reached on a green build.
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes "$apk"
